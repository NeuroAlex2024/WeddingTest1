<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Простой тест авторизации</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
    .form-group { margin: 15px 0; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    button { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; }
    .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
    .result.success { background: #d4edda; color: #155724; }
    .result.error { background: #f8d7da; color: #721c24; }
    pre { background: #f8f8f8; padding: 10px; border-radius: 4px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>🔐 Простой тест регистрации</h1>
  <p><strong>Проверка:</strong> Эта страница открыта через <code id="protocol"></code></p>
  
  <form id="regForm">
    <div class="form-group">
      <label>Телефон:</label>
      <input type="tel" id="phone" value="+79991234567" required>
    </div>
    
    <div class="form-group">
      <label>Пароль:</label>
      <input type="password" id="password" value="test123" required>
    </div>
    
    <button type="submit">Зарегистрироваться</button>
  </form>
  
  <div id="result"></div>
  
  <h3>Лог запросов:</h3>
  <pre id="log"></pre>

  <script>
    const logEl = document.getElementById('log');
    const resultEl = document.getElementById('result');
    const protocolEl = document.getElementById('protocol');
    
    // Показываем протокол
    protocolEl.textContent = window.location.protocol + '//' + window.location.host;
    
    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent += `[${time}] ${msg}\n`;
      console.log(msg);
    }
    
    log('Страница загружена');
    log('URL: ' + window.location.href);
    log('Origin: ' + window.location.origin);
    
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      
      resultEl.innerHTML = '<div class="result">⏳ Отправка запроса...</div>';
      log('\n=== НАЧАЛО ЗАПРОСА ===');
      log('Телефон: ' + phone);
      
      const url = '/api/auth/register';
      const fullUrl = window.location.origin + url;
      log('URL запроса: ' + fullUrl);
      
      const payload = {
        phone: phone,
        password: password,
        role: 'wedding'
      };
      
      log('Payload: ' + JSON.stringify(payload));
      
      try {
        log('Отправка fetch...');
        
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload),
          credentials: 'include'
        });
        
        log('Ответ получен!');
        log('Статус: ' + response.status + ' ' + response.statusText);
        log('Headers: ' + JSON.stringify(Object.fromEntries(response.headers.entries())));
        
        const data = await response.json();
        log('Тело ответа: ' + JSON.stringify(data, null, 2));
        
        if (response.ok) {
          resultEl.innerHTML = `
            <div class="result success">
              <strong>✅ Успех!</strong>
              <p>Пользователь создан: ${data.user.phone}</p>
              <p>ID: ${data.user.id}</p>
              <p>Токен: ${data.accessToken.substring(0, 30)}...</p>
            </div>
          `;
          log('=== УСПЕХ ===\n');
        } else {
          resultEl.innerHTML = `
            <div class="result error">
              <strong>❌ Ошибка сервера</strong>
              <p>Статус: ${response.status}</p>
              <p>Сообщение: ${data.error || 'Неизвестная ошибка'}</p>
            </div>
          `;
          log('=== ОШИБКА СЕРВЕРА ===\n');
        }
      } catch (error) {
        log('❌ ИСКЛЮЧЕНИЕ: ' + error.message);
        log('Stack: ' + error.stack);
        log('=== ОШИБКА СОЕДИНЕНИЯ ===\n');
        
        resultEl.innerHTML = `
          <div class="result error">
            <strong>❌ Ошибка соединения</strong>
            <p>${error.message}</p>
            <p><strong>Возможные причины:</strong></p>
            <ul>
              <li>Сервер не запущен</li>
              <li>Расширения браузера блокируют запрос</li>
              <li>Антивирус блокирует</li>
              <li>CORS проблема</li>
            </ul>
            <p><strong>Решение:</strong> Попробуй в режиме инкогнито (Ctrl+Shift+N)</p>
          </div>
        `;
        console.error('Полная ошибка:', error);
      }
    });
    
    // Перехват всех fetch запросов для логирования
    const originalFetch = window.fetch;
    window.fetch = function(...args) {
      log('FETCH вызван с аргументами: ' + JSON.stringify(args[0]));
      return originalFetch.apply(this, args);
    };
    
    log('Готов к тестированию!');
  </script>
</body>
</html>
